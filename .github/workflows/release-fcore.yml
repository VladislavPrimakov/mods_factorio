name: Release fcore to npm

on:
  push:
    tags:
      - 'fcore/v*'
      - 'fcore-v*'
      - 'fcore-*'
      - 'fcore@*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org/'

      - name: Install dependencies
        working-directory: ./fcore
        run: npm ci

      - name: Build fcore
        working-directory: ./fcore
        run: npm run build

      - name: Publish to npm
        working-directory: ./fcore
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
